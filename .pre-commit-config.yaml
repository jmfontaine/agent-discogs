repos:
  # General
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/rhysd/actionlint
    rev: 393031adb9afb225ee52ae2ccd7a5af5525e03e8 # frozen: v1.7.11
    hooks:
      - id: actionlint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 0839f92796ae388643a08a21640a029b322be5c2 # frozen: v0.15.2
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: b7fa7c655ce7b89804034228e1677f8cc1dca92a # frozen: v2.16.1
    hooks:
      - id: pyproject-fmt

  - repo: local
    hooks:
      - id: no-local-sdk
        name: no-local-sdk
        entry: "bash -c '! grep -q sources.discogs-sdk pyproject.toml || { echo \"Local discogs-sdk override found. Run just sdk-unlink\"; exit 1; }'"
        language: system
        files: pyproject.toml
        pass_filenames: false

      - id: dead-code
        name: dead-code
        # KLUDGE: this duplicates the `dead-code` justfile recipe, and both run
        # deadcode on Python 3.13 via uvx instead of the project's 3.14.
        # deadcode 2.4.1 calls ast.Str, which Python 3.14 removed, so it
        # crashes on 3.14; upstream is dormant (no release since 2024-08, crash
        # open as https://github.com/albertas/deadcode/issues/37).
        # Two things that look wrong but are not: the DC0 grep is needed
        # because deadcode exits 0 even when it reports findings, and the
        # `$status` test is needed because a crash produces no "DC0" and so
        # otherwise reads as a pass. See the justfile recipe for the long form.
        entry: bash -c 'output=$(uvx --python 3.13 deadcode@2.4.1 src tests 2>&1); status=$?; echo "$output"; if [ "$status" -ne 0 ] || grep -q "DC0" <<<"$output"; then exit 1; fi'
        language: system
        types: [python]
        pass_filenames: false

      - id: deps-unused
        name: deps-unused
        entry: uv run deptry src
        language: system
        types: [python]
        pass_filenames: false

      - id: type-check
        name: type-check
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false

name: Checks

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --all-extras --all-groups
      - name: Check dead code
        run: |
          # KLUDGE: deadcode runs on Python 3.13, not this job's 3.14, and is
          # not a dev dependency. deadcode 2.4.1 calls ast.Str, which Python
          # 3.14 removed, so it crashes on 3.14. Upstream is dormant: no
          # release since 2024-08, crash open as
          # https://github.com/albertas/deadcode/issues/37
          # Safe because deadcode only parses source that must already support
          # 3.10. The explicit --python beats the job's UV_PYTHON=3.14.
          # Remove the pin once deadcode supports 3.14.
          #
          # KLUDGE: `|| status=$?` rather than a plain `status=$?`, because
          # this step's shell is `bash -e`: a failing command substitution
          # aborts the step before `echo "$output"` can surface the traceback.
          output=$(uvx --python 3.13 deadcode@2.4.1 src tests 2>&1) || status=$?
          echo "$output"
          # KLUDGE: deadcode exits 0 even when it *does* report findings, so
          # grepping its DC0* codes is the only way to fail on them. Test the
          # status too: output alone treats a crash as success, since a
          # traceback has no "DC0" in it.
          if [ -n "${status:-}" ] || grep -q "DC0" <<<"$output"; then
            exit 1
          fi
      - name: Check pyproject.toml
        run: uv run pyproject-fmt --check pyproject.toml
      - name: Check formatting
        run: uv run ruff format --check
      - name: Lint
        run: uv run ruff check
      - name: Check types
        run: uv run ty check
      - name: Check unused dependencies
        run: uv run deptry src
      - name: Verify type completeness
        run: uv run pyright --ignoreexternal --verifytypes agent_discogs

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras --all-groups
      - name: Run tests
        run: uv run pytest --cov --cov-report=term-missing

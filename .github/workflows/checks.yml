name: Checks

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          # Jobs on the same Python otherwise compute the same cache key and
          # race to reserve it, which logs a warning in whichever loses.
          cache-suffix: ${{ github.job }}
      - name: Install dependencies
        run: uv sync --all-extras --all-groups
      - name: Check dead code
        run: |
          # KLUDGE: deadcode runs on Python 3.13, not this job's 3.14, and is
          # not a dev dependency. deadcode 2.4.1 calls ast.Str, which Python
          # 3.14 removed, so it crashes on 3.14. Upstream is dormant: no
          # release since 2024-08, crash open as
          # https://github.com/albertas/deadcode/issues/37
          # Safe because deadcode only parses source that must already support
          # 3.10. The explicit --python beats the job's UV_PYTHON=3.14.
          # Remove the pin once deadcode supports 3.14.
          #
          # KLUDGE: `|| status=$?` rather than a plain `status=$?`, because
          # this step's shell is `bash -e`: a failing command substitution
          # aborts the step before `echo "$output"` can surface the traceback.
          output=$(uvx --python 3.13 deadcode@2.4.1 src tests 2>&1) || status=$?
          echo "$output"
          # KLUDGE: deadcode exits 0 even when it *does* report findings, so
          # grepping its DC0* codes is the only way to fail on them. Test the
          # status too: output alone treats a crash as success, since a
          # traceback has no "DC0" in it.
          if [ -n "${status:-}" ] || grep -q "DC0" <<<"$output"; then
            exit 1
          fi
      - name: Check pyproject.toml
        run: uv run pyproject-fmt --check pyproject.toml
      - name: Check formatting
        run: uv run ruff format --check
      - name: Lint
        run: uv run ruff check
      - name: Check types
        run: uv run ty check
      - name: Check unused dependencies
        run: uv run deptry src
      - name: Verify type completeness
        run: uv run pyright --ignoreexternal --verifytypes agent_discogs

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: ${{ github.job }}
      - name: Install dependencies
        run: uv sync --all-extras --all-groups
      - name: Run tests
        run: uv run pytest --cov --cov-report=term-missing

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          cache-suffix: ${{ github.job }}
      - name: Build distributions
        run: uv build
      - name: Check distribution contents
        run: uv run --no-project python scripts/check_distributions.py dist
      - name: Check distribution metadata
        run: uvx twine check --strict dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  wheel:
    name: Wheel install (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported version, and the one where discogs-sdk's pydantic
        # marker resolves a different branch (see AGENTS.md). Transitive markers
        # do differ across 3.11-3.14, so widen this if that resolution matters.
        python-version: ["3.10", "3.15"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: ${{ github.job }}
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install the wheel
        # A clean environment outside the checkout, so the suite can only import
        # the installed package. Resolution comes from the wheel's published
        # metadata, which the lockfile-based test job never exercises.
        run: |
          uv venv --python ${{ matrix.python-version }} --seed /tmp/artifact-env
          /tmp/artifact-env/bin/python -m pip install --quiet dist/*.whl
      - name: Check what the wheel metadata resolved
        # Before the test stack lands, so nothing masks what the wheel itself
        # selected. The script also proves the package and console script come
        # from that environment, not the checkout.
        run: |
          /tmp/artifact-env/bin/python -m pip check
          /tmp/artifact-env/bin/python scripts/check_installed_package.py
      - name: Install the test stack
        run: |
          uv export --only-group test --no-hashes --no-emit-project -o /tmp/test-requirements.txt
          /tmp/artifact-env/bin/python -m pip install --quiet -r /tmp/test-requirements.txt
      - name: Check the test environment
        run: /tmp/artifact-env/bin/python -m pip check
      - name: Run the test suite against the installed wheel
        run: /tmp/artifact-env/bin/python -m pytest --no-cov

  sdist:
    name: Sdist install (Python 3.15)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
          cache-suffix: ${{ github.job }}
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Build and install the sdist
        run: |
          uv venv --python 3.15 --seed /tmp/sdist-env
          /tmp/sdist-env/bin/python -m pip install --quiet dist/*.tar.gz
      - name: Check the resolved environment
        run: /tmp/sdist-env/bin/python -m pip check
      - name: Check the installed package
        run: /tmp/sdist-env/bin/python scripts/check_installed_package.py

name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  publish:
    name: Publish
    runs-on: ubuntu-26.04
    needs: [checks]
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        # The exact artifacts the wheel and sdist jobs installed — never rebuilt
        # here, so what PyPI receives is what was tested.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: GitHub Release
    runs-on: ubuntu-26.04
    needs: [publish]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # git-cliff reads the history fetched here, and `gh release create`
          # authenticates through GH_TOKEN, so no later step needs git
          # credentials.
          persist-credentials: false
      - name: Generate release notes
        id: changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          args: --latest
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES_FILE: ${{ steps.changelog.outputs.changelog }}
        run: gh release create "$TAG" --notes-file "$NOTES_FILE"

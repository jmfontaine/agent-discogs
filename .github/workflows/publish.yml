name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [checks]
    environment: pypi
    steps:
      - name: Download distributions
        # The exact artifacts the wheel and sdist jobs installed — never rebuilt
        # here, so what PyPI receives is what was tested.
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [publish]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate release notes
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --notes-file "${{ steps.changelog.outputs.changelog }}"

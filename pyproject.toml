[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12.13,<0.13" ]

[project]
name = "agent-discogs"
version = "0.1.0"
description = "Token-efficient Discogs CLI for AI agents"
readme = "README.md"
keywords = [ "ai-agent", "cli", "discogs", "discogs-api", "music-database" ]
license = "Apache-2.0"
license-files = [ "LICENSE.txt" ]
authors = [ { name = "Jean-Marc Fontaine", email = "jm@jmfontaine.net" } ]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [ "click>=8.3.1", "discogs-sdk>=0.4.0", "pydantic>=2.12.5" ]
urls.Homepage = "https://github.com/jmfontaine/agent-discogs"
urls.Issues = "https://github.com/jmfontaine/agent-discogs/issues"
urls.Repository = "https://github.com/jmfontaine/agent-discogs"
scripts.agent-discogs = "agent_discogs:main"

[dependency-groups]
dev = [
  "deptry>=0.24",
  "pyproject-fmt>=2.16.1",
  "pyright>=1.1.408",
  "pytest>=8",
  "pytest-cov",
  "ruff>=0.15.2",
  "ty>=0.0.18",
]

[tool.ruff]
line-length = 88
lint.select = [
  "A",     # flake8-builtins
  "ARG",   # flake8-unused-arguments
  "ASYNC", # flake8-async
  "B",     # flake8-bugbear
  "BLE",   # flake8-blind-except
  "C4",    # flake8-comprehensions
  "DTZ",   # flake8-datetimez
  "E",     # pycodestyle errors
  "EM",    # flake8-errmsg
  "EXE",   # flake8-executable
  "F",     # Pyflakes
  "FA",    # flake8-future-annotations
  "FLY",   # flynt
  "FURB",  # refurb
  "G",     # flake8-logging-format
  "I",     # isort
  "ICN",   # flake8-import-conventions
  "INT",   # flake8-gettext
  "ISC",   # flake8-implicit-str-concat
  "LOG",   # flake8-logging
  "N",     # pep8-naming
  "PERF",  # Perflint
  "PGH",   # pygrep-hooks
  "PIE",   # flake8-pie
  "PL",    # Pylint
  "PT",    # flake8-pytest-style
  "PTH",   # flake8-use-pathlib
  "PYI",   # flake8-pyi
  "RET",   # flake8-return
  "RSE",   # flake8-raise
  "RUF",   # Ruff-specific rules
  "S",     # flake8-bandit
  "SIM",   # flake8-simplify
  "SLF",   # flake8-self
  "TC",    # flake8-type-checking
  "TID",   # flake8-tidy-imports
  "TRY",   # tryceratops
  "UP",    # pyupgrade
  "W",     # pycodestyle warnings
  "YTT",   # flake8-2020
]
lint.ignore = [
  "EM101",   # raw-string-in-exception - the test doubles that raise use one-off literals; naming them first adds a line and no clarity
  "EM102",   # f-string-in-exception - refs.py and get.py interpolate the offending ref or noun, which is what makes the message actionable
  "PLC0415", # import-outside-top-level - errors.py and __init__.py import discogs_sdk lazily so --help and --version never pay to load it
  "PLR0911", # too-many-return-statements - format_error() returns one tailored message per SDK exception type
  "PLR0912", # too-many-branches - verbose release output walks a long list of independently optional Discogs fields
  "PLR0913", # too-many-arguments - click hands every command option to the callback as its own keyword argument
  "PLR0915", # too-many-statements - formatters append output line by line, which puts one of them just over the 50-statement limit
  "PLR0917", # too-many-positional-arguments - the internal _get_* helpers mirror their command's full option list
  "TC001",   # typing-only-first-party-import - annotations are already deferred by __future__, so guarding PageResult only splits json_output.py's imports in two
  "TC002",   # typing-only-third-party-import - a TYPE_CHECKING guard would hide that pagination.py is built on Discogs and BaseModel
  "TC003",   # typing-only-standard-library-import - importing Callable, Iterator or Mapping costs nothing worth guarding
  "TRY003",  # raise-vanilla-args - these messages are read by agents, so they belong at the raise site rather than in an exception subclass
]
lint.per-file-ignores."tests/**" = [
  "ARG001",  # unused-function-argument - the fake _send() in test_pagination.py must accept params= because fetch_page passes it by keyword, then ignores it
  "ARG005",  # unused-lambda-argument - the SimpleNamespace lambdas standing in for SDK methods take the real signature and use only part of it
  "PLR2004", # magic-value-comparison - assertions compare against literal Discogs IDs and counts, which read better inline than as named constants
  "S101",    # assert - pytest expresses every assertion this way
  "S108",    # hardcoded-temp-file - test_formatting.py only formats /tmp/test-cache into the status output; nothing is created or written there
  "SLF001",  # private-member-access - test_client.py resets the module-level _client singleton around each test
]

[tool.pyproject-fmt]
keep_full_version = true
max_supported_python = "3.15"

[tool.pytest]
ini_options.addopts = "-m 'not live'"
ini_options.markers = [
  "live: hits the real Discogs API; run with `just test-live` (needs DISCOGS_TOKEN)",
]

[tool.deadcode]
ignore-names = [
  "_patch_get",
  "_patch_search",
  "_reset_singleton",
  "format_help",
  "get_skill",        # click subcommands are registered by decorator, invisible to deadcode
  "skill_path",
]

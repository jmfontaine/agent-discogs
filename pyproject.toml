[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.10.4,<0.12" ]

[project]
name = "agent-discogs"
version = "0.1.0"
description = "Token-efficient Discogs CLI for AI agents"
readme = "README.md"
keywords = [ "ai-agent", "cli", "discogs", "discogs-api", "music-database" ]
license = "Apache-2.0"
authors = [ { name = "Jean-Marc Fontaine", email = "jm@jmfontaine.net" } ]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [ "click>=8.3.1", "discogs-sdk>=0.3.1", "pydantic>=2.12.5" ]
urls.Homepage = "https://github.com/jmfontaine/agent-discogs"
urls.Issues = "https://github.com/jmfontaine/agent-discogs/issues"
urls.Repository = "https://github.com/jmfontaine/agent-discogs"
scripts.agent-discogs = "agent_discogs:main"

[dependency-groups]
dev = [
  "deadcode>=2.4.1",
  "deptry>=0.24",
  "pyproject-fmt>=2.16.1",
  "pyright>=1.1.408",
  "pytest>=8",
  "pytest-cov",
  "ruff>=0.15.2",
  "ty>=0.0.18",
]

[tool.ruff]
line-length = 88
lint.select = [
  "A",     # flake8-builtins
  "ARG",   # flake8-unused-arguments
  "ASYNC", # flake8-async
  "B",     # flake8-bugbear
  "BLE",   # flake8-blind-except
  "C4",    # flake8-comprehensions
  "DTZ",   # flake8-datetimez
  "E",     # pycodestyle errors
  "EM",    # flake8-errmsg
  "EXE",   # flake8-executable
  "F",     # Pyflakes
  "FA",    # flake8-future-annotations
  "FLY",   # flynt
  "FURB",  # refurb
  "G",     # flake8-logging-format
  "I",     # isort
  "ICN",   # flake8-import-conventions
  "INT",   # flake8-gettext
  "ISC",   # flake8-implicit-str-concat
  "LOG",   # flake8-logging
  "N",     # pep8-naming
  "PERF",  # Perflint
  "PGH",   # pygrep-hooks
  "PIE",   # flake8-pie
  "PL",    # Pylint
  "PT",    # flake8-pytest-style
  "PTH",   # flake8-use-pathlib
  "PYI",   # flake8-pyi
  "RET",   # flake8-return
  "RSE",   # flake8-raise
  "RUF",   # Ruff-specific rules
  "S",     # flake8-bandit
  "SIM",   # flake8-simplify
  "SLF",   # flake8-self
  "TC",    # flake8-type-checking
  "TID",   # flake8-tidy-imports
  "TRY",   # tryceratops
  "UP",    # pyupgrade
  "W",     # pycodestyle warnings
  "YTT",   # flake8-2020
]
lint.ignore = [
  "EM101",   # exception messages are the product; hoisting them buys nothing
  "EM102",   # ditto, for f-string messages
  "PLC0415", # imports are deliberately lazy to keep CLI startup fast
  "PLR0911", # formatters branch a lot by design
  "PLR0912", # ditto
  "PLR0913", # click commands are wide by nature
  "PLR0915", # formatters are long by nature
  "PLR0917", # ditto, for positional arguments
  "TC001",   # `from __future__ import annotations` already defers the cost, so
  "TC002",   # moving imports into TYPE_CHECKING blocks only hurts readability
  "TC003",   # ditto, for stdlib imports
  "TRY003",  # see EM101: long messages outside the exception class are fine here
]
lint.per-file-ignores."tests/**" = [
  "ARG",     # test doubles take arguments they never read
  "PLR2004", # IDs and counts read better inline than as named constants
  "S101",    # pytest asserts
  "S108",    # hardcoded /tmp path in a cache-dir test
  "SLF001",  # tests reset singletons and stub SDK plumbing
]

[tool.pyproject-fmt]
keep_full_version = true
max_supported_python = "3.14"

[tool.deadcode]
ignore-names = [
  "_patch_get",
  "_patch_search",
  "_reset_singleton",
  "format_help",
]
